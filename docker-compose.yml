version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: flowops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - flowops_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flowops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flowops_redisdata:/data

volumes:
  flowops_pgdata:
  flowops_redisdata:

